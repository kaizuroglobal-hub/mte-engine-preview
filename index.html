<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTE Engine Preview</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#mteFrame{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<div id="loading" style="font:14px Arial;padding:24px">Loading MTE Engine Preview…</div>
<script>
(async()=>{
  try{
    const parts=["preview-chunks/00.part","preview-chunks/01.part","preview-chunks/02.part","preview-chunks/03.part","preview-chunks/04.part","preview-chunks/05.part","preview-chunks/06.part","preview-chunks/07.part","preview-chunks/08.part","preview-chunks/09.part","preview-chunks/10.part","preview-chunks/11.part","preview-chunks/12.part","preview-chunks/13.part","preview-chunks/14.part","preview-chunks/15.part","preview-chunks/16.part","preview-chunks/17.part","preview-chunks/18.part"];
    const BUILD="20260927-mte-iframe-loader-1";
    const responses=await Promise.all(parts.map(p=>fetch(p+"?v="+BUILD,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Failed to load "+p+" ("+r.status+")");return r.text();})));
    const frame=document.createElement("iframe");
    frame.id="mteFrame";
    frame.title="MTE Engine";
    frame.setAttribute("allow","clipboard-read; clipboard-write");
    frame.srcdoc=responses.join("");
    frame.onload=()=>{const l=document.getElementById("loading");if(l)l.remove();};
    document.body.appendChild(frame);
  }catch(e){
    document.body.innerHTML='<pre style="font:14px monospace;padding:24px;white-space:pre-wrap">MTE Engine Preview failed to load. '+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>
