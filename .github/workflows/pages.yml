name: Publish MTE Engine Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rebuilt preview artifact
        run: |
          mkdir -p _site /tmp/mte-preview
          curl -fL --retry 3 "https://sdmntprwestus.oaiusercontent.com/files/00000000-cb84-8230-a7ca-c92c860ddb6b/raw?se=2026-09-26T06%3A21%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=806f9bdb-a546-57b5-92ec-f6d11a62ff3a&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T05%3A27%3A53Z&ske=2026-09-27T05%3A27%3A53Z&sks=b&skv=2026-02-06&sig=QPxxhRU/Z6Eve0aISpdwUMYmsvVw%2Bwvebgpj14%2BduLs%3D" -o /tmp/mte-preview/pages.zip
          unzip -o /tmp/mte-preview/pages.zip -d /tmp/mte-preview
          tar -xf /tmp/mte-preview/artifact.tar -C /tmp/mte-preview
          cp /tmp/mte-preview/index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
