name: Publish MTE Engine Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract preview
        run: |
          mkdir -p _site
          runuser_tmp=false
          mkdir -p /tmp/mte-preview
          unzip -o MTE_ENGINE_PREVIEW.zip -d /tmp/mte-preview
          tar -xf /tmp/mte-preview/artifact.tar -C /tmp/mte-preview
          HTML="$(find /tmp/mte-preview -name 'MTE_ENGINE_PREVIEW.html' -type f | head -1)"
          if [ -z "$HTML" ]; then
            echo "MTE_ENGINE_PREVIEW.html not found in archive"
            find /tmp/mte-preview -maxdepth 3 -type f
            exit 1
          fi
          cp "$HTML" _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
